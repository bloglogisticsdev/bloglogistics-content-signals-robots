name: Build WordPress Plugin ZIP

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and attach plugin ZIP
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare plugin folder
        run: |
          PLUGIN_SLUG="bloglogistics-content-signals-robots"
          BUILD_DIR="/tmp/${PLUGIN_SLUG}"

          rm -rf "${BUILD_DIR}"
          mkdir -p "${BUILD_DIR}"

          rsync -av \
            --exclude=".git" \
            --exclude=".github" \
            --exclude="${PLUGIN_SLUG}.zip" \
            ./ "${BUILD_DIR}/"

      - name: Create ZIP
        run: |
          PLUGIN_SLUG="bloglogistics-content-signals-robots"
          cd /tmp
          zip -r "${GITHUB_WORKSPACE}/${PLUGIN_SLUG}.zip" "${PLUGIN_SLUG}"

      - name: Upload ZIP to release
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PLUGIN_SLUG="bloglogistics-content-signals-robots"
          gh release upload "${{ github.event.release.tag_name }}" "${PLUGIN_SLUG}.zip" --clobber

      - name: Upload ZIP as workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: bloglogistics-content-signals-robots
          path: bloglogistics-content-signals-robots.zip

      - name: Build update manifest
        if: github.event_name == 'release'
        run: |
          python3 <<'PY'
          import datetime
          import html
          import json
          import re
          from pathlib import Path

          plugin_name = "BlogLogistics Content Signals for Robots.txt"
          plugin_slug = "bloglogistics-content-signals-robots"
          repo_url = "https://github.com/bloglogisticsdev/bloglogistics-content-signals-robots"
          tag_name = "${{ github.event.release.tag_name }}"
          version = tag_name.lstrip("v")
          download_url = f"{repo_url}/releases/download/v{version}/{plugin_slug}.zip"
          last_updated = datetime.datetime.utcnow().strftime("%Y-%m-%d")

          readme_path = Path("readme.txt")
          readme = readme_path.read_text(encoding="utf-8", errors="replace")

          changelog_match = re.search(
              r"^==\s*Changelog\s*==\s*(.*?)(?=^==\s+|\Z)",
              readme,
              flags=re.IGNORECASE | re.MULTILINE | re.DOTALL,
          )

          changelog_text = changelog_match.group(1).strip() if changelog_match else ""

          html_parts = []
          current_items = []

          def flush_items():
              nonlocal_items = list(current_items)
              current_items.clear()
              if nonlocal_items:
                  html_parts.append("<ul>")
                  for item in nonlocal_items:
                      html_parts.append(f"<li>{html.escape(item)}</li>")
                  html_parts.append("</ul>")

          for raw_line in changelog_text.splitlines():
              line = raw_line.strip()
              if not line:
                  continue

              version_heading = re.match(r"^=\s*(.*?)\s*=$", line)
              if version_heading:
                  flush_items()
                  html_parts.append(f"<h4>{html.escape(version_heading.group(1))}</h4>")
                  continue

              if line.startswith("*"):
                  current_items.append(line.lstrip("*").strip())
                  continue

              current_items.append(line)

          flush_items()

          changelog_html = "".join(html_parts) if html_parts else "<p>No changelog available.</p>"

          manifest = {
              "name": plugin_name,
              "version": version,
              "download_url": download_url,
              "homepage": repo_url,
              "requires": "7.0",
              "tested": "7.0",
              "requires_php": "8.3",
              "last_updated": last_updated,
              "author": '<a href="https://www.bloglogistics.com" target="_blank" rel="noopener noreferrer">BlogLogistics</a>',
              "author_profile": "https://www.bloglogistics.com",
              "icons": {
                  "1x": "https://updates.bloglogistics.com/plugins/assets/icon-128x128.png",
                  "2x": "https://updates.bloglogistics.com/plugins/assets/icon-256x256.png",
                  "default": "https://updates.bloglogistics.com/plugins/assets/icon-128x128.png",
              },
              "banners": {
                  "low": "https://updates.bloglogistics.com/plugins/assets/banner-772x250.png",
                  "high": "https://updates.bloglogistics.com/plugins/assets/banner-1544x500.png",
                  "default": "https://updates.bloglogistics.com/plugins/assets/banner-772x250.png",
              },
              "sections": {
                  "description": "Safely manages website-use preference signals in a physical robots.txt file.",
                  "installation": '<ol><li>Install and activate the plugin.</li><li>Go to <strong>BlogLogistics &gt; Robots.txt Content Preferences</strong>.</li><li>Confirm that a physical <code>robots.txt</code> file was found.</li><li>Choose the website-use preferences you want to publish.</li><li>Save your changes. The plugin updates only the managed preference line under <code>User-agent: *</code>.</li></ol>',
                  "faq": '<h4>Does this plugin rewrite my whole robots.txt file?</h4><p>No. It only manages the Content-Signal line under <code>User-agent: *</code> and leaves the rest of the file alone.</p><h4>Does this plugin work without a physical robots.txt file?</h4><p>This plugin is intended for sites that already use a physical <code>robots.txt</code> file. If no physical file is found, the settings page explains that the plugin cannot manage it automatically.</p><h4>What happens if I turn management off?</h4><p>If there was an original Content-Signal line, the plugin restores it. If there was no original Content-Signal line, the managed line is removed.</p><h4>Why does the plugin save backups?</h4><p>Before changing <code>robots.txt</code>, this plugin saves a backup copy. The plugin keeps the latest 5 backups so you can recover from mistakes without filling your server with old files.</p><h4>Can I manually edit robots.txt?</h4><p>Yes. The settings page includes a full <code>robots.txt</code> editor. If you manually change the Content-Signal line under <code>User-agent: *</code>, the toggle boxes update to match after saving.</p><h4>What happens if I delete the plugin?</h4><p>The plugin removes its saved settings and plugin-created backup files. Your current <code>robots.txt</code> file is left as-is.</p>',
                  "changelog": changelog_html,
              },
          }

          output_path = Path(f"{plugin_slug}.json")
          output_path.write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          print(output_path.read_text(encoding="utf-8"))
          PY

      - name: Upload update manifest by FTPS
        if: github.event_name == 'release'
        env:
          FTP_SERVER: ${{ secrets.BLOGLOGISTICS_UPDATES_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.BLOGLOGISTICS_UPDATES_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.BLOGLOGISTICS_UPDATES_FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.BLOGLOGISTICS_UPDATES_FTP_SERVER_DIR }}
        run: |
          PLUGIN_SLUG="bloglogistics-content-signals-robots"

          sudo apt-get update
          sudo apt-get install -y lftp

          lftp -u "${FTP_USERNAME}","${FTP_PASSWORD}" "${FTP_SERVER}" <<EOF
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate false
          cd "${FTP_SERVER_DIR}"
          put "${PLUGIN_SLUG}.json" -o "${PLUGIN_SLUG}.json"
          bye
          EOF
