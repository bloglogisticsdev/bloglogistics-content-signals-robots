name: Build WordPress Plugin ZIP

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and attach plugin ZIP
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare plugin folder
        run: |
          PLUGIN_SLUG="bloglogistics-content-signals-robots"
          BUILD_DIR="/tmp/${PLUGIN_SLUG}"

          rm -rf "${BUILD_DIR}"
          mkdir -p "${BUILD_DIR}"

          rsync -av \
            --exclude=".git" \
            --exclude=".github" \
            --exclude="${PLUGIN_SLUG}.zip" \
            ./ "${BUILD_DIR}/"

      - name: Create ZIP
        run: |
          PLUGIN_SLUG="bloglogistics-content-signals-robots"
          cd /tmp
          zip -r "${GITHUB_WORKSPACE}/${PLUGIN_SLUG}.zip" "${PLUGIN_SLUG}"

      - name: Upload ZIP to release
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PLUGIN_SLUG="bloglogistics-content-signals-robots"
          gh release upload "${{ github.event.release.tag_name }}" "${PLUGIN_SLUG}.zip" --clobber

      - name: Upload ZIP as workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: bloglogistics-content-signals-robots
          path: bloglogistics-content-signals-robots.zip

      - name: Build update manifest
        if: github.event_name == 'release'
        run: |
          python3 <<'PY'
          import datetime
          import html
          import json
          import re
          from pathlib import Path

          plugin_name = "BlogLogistics Content Signals for Robots.txt"
          plugin_slug = "bloglogistics-content-signals-robots"
          repo_url = "https://github.com/bloglogisticsdev/bloglogistics-content-signals-robots"
          tag_name = "${{ github.event.release.tag_name }}"
          version = tag_name.lstrip("v")
          download_url = f"{repo_url}/releases/download/v{version}/{plugin_slug}.zip"
          last_updated = datetime.datetime.utcnow().strftime("%Y-%m-%d")

          readme_path = Path("readme.txt")
          readme = readme_path.read_text(encoding="utf-8", errors="replace")

          def format_inline(value):
              """Convert a small subset of WordPress readme markup to safe HTML."""
              parts = re.split(r"(`[^`]*`)", value)
              output = []

              for part in parts:
                  if part.startswith("`") and part.endswith("`") and len(part) >= 2:
                      output.append(f"<code>{html.escape(part[1:-1])}</code>")
                  else:
                      output.append(html.escape(part))

              return "".join(output)

          def extract_readme_section(readme_text, section_name):
              match = re.search(
                  rf"^==\s*{re.escape(section_name)}\s*==\s*(.*?)(?=^==\s+|\Z)",
                  readme_text,
                  flags=re.IGNORECASE | re.MULTILINE | re.DOTALL,
              )

              return match.group(1).strip() if match else ""

          def convert_readme_section_to_html(section_text):
              html_parts = []
              paragraph_lines = []
              list_items = []
              list_type = None

              def flush_paragraph():
                  nonlocal paragraph_lines

                  if paragraph_lines:
                      paragraph = " ".join(paragraph_lines).strip()
                      if paragraph:
                          html_parts.append(f"<p>{format_inline(paragraph)}</p>")
                      paragraph_lines = []

              def flush_list():
                  nonlocal list_items, list_type

                  if list_items and list_type:
                      html_parts.append(f"<{list_type}>")
                      for item in list_items:
                          html_parts.append(f"<li>{format_inline(item)}</li>")
                      html_parts.append(f"</{list_type}>")

                  list_items = []
                  list_type = None

              for raw_line in section_text.splitlines():
                  line = raw_line.strip()

                  if not line:
                      flush_paragraph()
                      flush_list()
                      continue

                  numbered_item = re.match(r"^\d+\.\s+(.*)$", line)
                  bullet_item = re.match(r"^\*\s+(.*)$", line)

                  if numbered_item:
                      flush_paragraph()
                      if list_type != "ol":
                          flush_list()
                          list_type = "ol"
                      list_items.append(numbered_item.group(1).strip())
                      continue

                  if bullet_item:
                      flush_paragraph()
                      if list_type != "ul":
                          flush_list()
                          list_type = "ul"
                      list_items.append(bullet_item.group(1).strip())
                      continue

                  flush_list()
                  paragraph_lines.append(line)

              flush_paragraph()
              flush_list()

              return "".join(html_parts)

          def convert_faq_to_html(faq_text):
              html_parts = []
              current_question = None
              current_answer_lines = []

              def flush_question():
                  nonlocal current_question, current_answer_lines

                  if not current_question:
                      return

                  html_parts.append(f"<h4>{format_inline(current_question)}</h4>")
                  answer_html = convert_readme_section_to_html("\n".join(current_answer_lines).strip())
                  html_parts.append(answer_html if answer_html else "<p></p>")

                  current_question = None
                  current_answer_lines = []

              for raw_line in faq_text.splitlines():
                  line = raw_line.strip()
                  question_match = re.match(r"^=\s*(.*?)\s*=$", line)

                  if question_match:
                      flush_question()
                      current_question = question_match.group(1).strip()
                      current_answer_lines = []
                      continue

                  if current_question is not None:
                      current_answer_lines.append(raw_line)

              flush_question()

              return "".join(html_parts)

          def convert_changelog_to_html(changelog_text):
              html_parts = []
              current_items = []

              def flush_items():
                  nonlocal current_items

                  if current_items:
                      html_parts.append("<ul>")
                      for item in current_items:
                          html_parts.append(f"<li>{format_inline(item)}</li>")
                      html_parts.append("</ul>")
                      current_items = []

              for raw_line in changelog_text.splitlines():
                  line = raw_line.strip()
                  if not line:
                      continue

                  version_heading = re.match(r"^=\s*(.*?)\s*=$", line)
                  if version_heading:
                      flush_items()
                      html_parts.append(f"<h4>{format_inline(version_heading.group(1))}</h4>")
                      continue

                  if line.startswith("*"):
                      current_items.append(line.lstrip("*").strip())
                      continue

                  current_items.append(line)

              flush_items()

              return "".join(html_parts)

          installation_text = extract_readme_section(readme, "Installation")
          faq_text = extract_readme_section(readme, "Frequently Asked Questions")
          changelog_text = extract_readme_section(readme, "Changelog")

          installation_html = convert_readme_section_to_html(installation_text) or "<p>No installation instructions available.</p>"
          faq_html = convert_faq_to_html(faq_text) or "<p>No FAQ available.</p>"
          changelog_html = convert_changelog_to_html(changelog_text) or "<p>No changelog available.</p>"

          manifest = {
              "name": plugin_name,
              "version": version,
              "download_url": download_url,
              "homepage": repo_url,
              "requires": "7.0",
              "tested": "7.0",
              "requires_php": "8.3",
              "last_updated": last_updated,
              "author": '<a href="https://www.bloglogistics.com" target="_blank" rel="noopener noreferrer">BlogLogistics</a>',
              "author_profile": "https://www.bloglogistics.com",
              "icons": {
                  "1x": "https://updates.bloglogistics.com/plugins/assets/icon-128x128.png",
                  "2x": "https://updates.bloglogistics.com/plugins/assets/icon-256x256.png",
                  "default": "https://updates.bloglogistics.com/plugins/assets/icon-128x128.png",
              },
              "banners": {
                  "low": "https://updates.bloglogistics.com/plugins/assets/banner-772x250.png",
                  "high": "https://updates.bloglogistics.com/plugins/assets/banner-1544x500.png",
                  "default": "https://updates.bloglogistics.com/plugins/assets/banner-772x250.png",
              },
              "sections": {
                  "description": "Safely manages website-use preference signals in a physical robots.txt file.",
                  "installation": installation_html,
                  "faq": faq_html,
                  "changelog": changelog_html,
              },
          }

          output_path = Path(f"{plugin_slug}.json")
          output_path.write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          print(output_path.read_text(encoding="utf-8"))
          PY

      - name: Upload update manifest by FTPS
        if: github.event_name == 'release'
        env:
          FTP_SERVER: ${{ secrets.BLOGLOGISTICS_UPDATES_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.BLOGLOGISTICS_UPDATES_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.BLOGLOGISTICS_UPDATES_FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.BLOGLOGISTICS_UPDATES_FTP_SERVER_DIR }}
        run: |
          PLUGIN_SLUG="bloglogistics-content-signals-robots"

          sudo apt-get update
          sudo apt-get install -y lftp

          lftp -u "${FTP_USERNAME}","${FTP_PASSWORD}" "${FTP_SERVER}" <<EOF
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate false
          cd "${FTP_SERVER_DIR}"
          put "${PLUGIN_SLUG}.json" -o "${PLUGIN_SLUG}.json"
          bye
          EOF
